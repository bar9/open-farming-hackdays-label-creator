<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Home</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width" />
        <link href="https://cdn.jsdelivr.net/npm/daisyui@4.8.0/dist/full.min.css" rel="stylesheet" type="text/css" />
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body data-theme="light" class="min-h-screen">
        <main class="grid grid-cols-1 gap-12 md:grid-cols-2">
            <div class="flex flex-col min-h-screen gap-6 p-8 pb-12 bg-neutral-200">
                <h1 class="mb-4 text-4xl">LMK Creator | Lebensmittelkennzeichnung</h1>
                <div>
                    <label class="flex flex-col gap-2">
                        Sachbezeichnung
                        <input type="text" placeholder="Produktname / Produktbeschrieb - z.B. Haferriegel mit Honig" class="w-full input input-bordered" />
                    </label>
                </div>
                <div class="flex items-end gap-2">
                    <label class="flex flex-col w-full gap-2">
                        <label for="ice-cream-choice">Zutaten</label>
                        <input class="w-full input input-bordered" list="ingredientsList" id="ingredientsInput" name="ingredients" />
                        <datalist id="ingredientsList">
                            <option value="Schokolade"></option>
                            <option value="Kokosnuss"></option>
                            <option value="Erdnuss"></option>
                            <option value="Milch"></option>
                            <option value="Zucker"></option>
                        </datalist>
                    </label>
                    <button class="btn btn-primary">Hinzufügen</button>
                </div>
                <div class="grid grid-cols-3 gap-4">
                    <div class="flex flex-col gap-2">
                        <label>Produkt</label>
                        <input type="text" placeholder="Joghurt" class="w-full input input-bordered" disabled />
                    </div>
                    <div class="flex flex-col gap-2">
                        <label>Menge</label>
                        <input type="text" placeholder="50g" class="w-full input input-bordered" />
                    </div>
                    <div class="flex flex-col gap-2">
                        <label>Herkunft</label>
                        <input type="text" placeholder="Schweiz" value="Schweiz" class="w-full input input-bordered" />
                    </div>
                    <!--<div class="flex flex-col justify-center gap-2">
                        <label>Allergen</label>
                        <div>
                            <input type="checkbox" checked="checked" class="checkbox" />
                        </div>
                    </div>-->
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <div class="flex flex-col gap-2">
                            <label>Datumseingabe</label>
                            <input class="w-full input input-bordered" type="date" id="haltbarBis" name="haltbarBis" value="2024-03-23" min="2024-03-23" max="2028-03-23" />
                        </div>
                    </div>
                    <div>
                        <div class="flex flex-col gap-2">
                            <label>Zusatzinformationen</label>
                            <textarea class="w-full textarea textarea-bordered" rows="4" placeholder="Haftungsausschlüsse, Kann Spuren von Nüssen enthalten, Gebrauchsanleitung"></textarea>
                        </div>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <div class="flex flex-col gap-2">
                            <label>Aufbewahrung + Lagerung</label>
                            <textarea class="w-full textarea textarea-bordered" rows="2" placeholder="z.B. dunkel und kühl bei max. 5°C lagern"></textarea>
                        </div>
                    </div>
                    <div>
                        <div class="flex flex-col gap-2">
                            <label>Produktionsland</label>
                            <textarea class="w-full textarea textarea-bordered" rows="2" placeholder="">Schweiz</textarea>
                        </div>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <div class="flex flex-col gap-2">
                            <label>Nettogewicht</label>
                            <input type="text" placeholder="300g" value="" class="w-full input input-bordered" />
                        </div>
                    </div>
                    <div>
                        <div class="flex flex-col gap-2">
                            <label>Abtropfgewicht</label>
                            <input type="text" placeholder="125g" value="" class="w-full input input-bordered" />
                        </div>
                    </div>
                </div>
                <hr class="my-2 border-dashed border-1 border-neutral-400" />
                <div class="flex flex-col">
                    <h4 class="mb-2 text-xl">Adresse</h4>
                    <div class="flex flex-col gap-1 mb-2">
                        <label>Vorname / Name / Firma</label>
                        <input type="text" placeholder="Hans Muster AG" value="" class="w-full input input-bordered" />
                    </div>
                    <div class="grid grid-cols-3 gap-4">
                        <div class="flex flex-col gap-1">
                            <label>Adresse</label>
                            <input type="text" placeholder="Teststrasse 1" value="" class="w-full input input-bordered" />
                        </div>
                        <div class="flex flex-col gap-1">
                            <label>PLZ</label>
                            <input type="text" placeholder="CH-4001" value="" class="w-full input input-bordered" />
                        </div>
                        <div class="flex flex-col gap-1">
                            <label>Ort</label>
                            <input type="text" placeholder="Basel" value="" class="w-full input input-bordered" />
                        </div>
                    </div>
                </div>
                <hr class="my-2 border-dashed border-1 border-neutral-400" />
                <div class="flex flex-col">
                    <h4 class="mb-2 text-xl">Preis</h4>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="flex flex-col gap-2">
                            <label class="text-sm">Preis pro 100g</label>
                            <input type="text" placeholder="Teststrasse 1" value="" class="w-full input input-bordered" />
                        </div>
                        <div class="flex flex-col gap-2">
                            <label class="text-sm">Preis Total</label>
                            <input type="text" placeholder="CH-4001" value="" class="w-full input input-bordered" />
                        </div>
                    </div>
                </div>
            </div>
            <div class="p-8">
                <div>[Generated Output]</div>
            </div>
        </main>
    </body>
</html>

faq:
  title: Questions fréquentes
  intro: Réponses aux questions les plus fréquentes sur Declarino et l'étiquetage des denrées alimentaires.
  # Les questions et les réponses sont associées par leur index :
  # questions[0] correspond à answers[0]. Les deux listes doivent donc avoir la
  # même longueur et le même ordre dans tous les fichiers de langue.
  questions:
    - Declarino remplace-t-il un conseil juridique ?
    - Mes recettes sont-elles enregistrées sur un serveur ?
  answers:
    - Non. Declarino t'aide à créer une étiquette, mais ne prétend pas être exhaustif et ne remplace pas un examen juridique. La responsabilité de l'exactitude de la déclaration incombe à la personne qui met la denrée alimentaire sur le marché.
    - Non. Declarino fonctionne entièrement dans ton navigateur. Tes saisies sont enregistrées uniquement en local et dans le lien que tu génères via « Copier le lien ». Toute personne disposant de ce lien voit la recette qu'il contient.

impressum: |
  # Mentions légales, Protection des données
  
  14.03.2025
  
  Le créateur d'étiquetage est un outil en ligne qui vise à simplifier le calcul des recettes et la création d'étiquettes alimentaires en Suisse. Le créateur d'étiquetage est encore en développement et ne prétend pas être exhaustif. Un organisme responsable composé du FiBL, de Bio Suisse, du centre agricole Liebegg, du centre de formation et d'éducation Arenenberg et du Hightech Zentrum Aargau AG revendique tous les droits sur celui-ci.
  
  ## Mentions légales
  
  ### Adresse de contact de l'organisme responsable
  
  Centre agricole LIEBEGG\
  Économie domestique / Vente directe\
  CH-5722 Gränichen AG
  
  ### Personne habilitée à représenter
  
  Manuela Isenschmid
  

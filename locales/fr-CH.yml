disclaimer:
  text: "Declarino.ch vous aide à créer des étiquettes. L'application facilite le processus en offrant une structure et en signalant les exceptions ainsi que les textes de loi ou directives utiles. La responsabilité de la création des étiquettes vous incombe toutefois – Declarino.ch ne sert que d'outil d'aide.\n\nVeuillez noter que Declarino.ch décline toute garantie quant à l'exactitude, l'actualité et l'exhaustivité des informations fournies. Toute responsabilité est exclue."
  button_tooltip: "Veuillez accepter la clause de non-responsabilité"


<!DOCTYPE html>
<html>
  <head>
    <title>declarino.ch</title>
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="UTF-8" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!--
      Umami (cookiefreie Reichweitenmessung, EU-Hosting).

      data-exclude-search ist hier KEINE Feinheit, sondern zwingend: Der
      Teilen-Link traegt die ganze Rezeptur im Query-String, inklusive
      producer_name, producer_address, producer_phone und producer_email.
      Wer einen geteilten Link oder einen Kurz-Link oeffnet, haette diese
      Personendaten sonst an Umami gesendet. Beim blossen Ausfuellen
      entsteht das Problem nicht, weil der Query-String nur in den
      Kopier-Knopf fliesst und nie in die Adresszeile.

      data-domains grenzt auf die Produktion ein, damit Staging
      (bar9.github.io) und lokale Entwicklung die Zahlen nicht verfaelschen.

      data-do-not-track respektiert die Browser-Einstellung.
    -->
    <script defer
            src="https://cloud.umami.is/script.js"
            data-website-id="ab1669ee-d98b-4d05-8c61-394a79ae2bdf"
            data-exclude-search="true"
            data-do-not-track="true"
            data-domains="www.declarino.ch,declarino.ch"></script>
  <link rel="preload" as="script" href="/open-farming-hackdays-label-creator/assets/open-farming-hackdays-label-creator-dxhebe393f6acec33d6.js" crossorigin></head>
  <body>
    <script>
      // Capture query parameters before the router processes them
      (function() {
        const search = window.location.search;
        if (search && search.length > 1) {
          // Save to sessionStorage so our component can read it
          sessionStorage.setItem('pre_route_params', search.substring(1)); // Remove the '?'
        }
      })();
    </script>
    <div id="main"></div>
  <script type="module" async src="/open-farming-hackdays-label-creator/assets/open-farming-hackdays-label-creator-dxhebe393f6acec33d6.js"></script>
            </body>
</html>

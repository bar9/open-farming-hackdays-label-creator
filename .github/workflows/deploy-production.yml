name: Deploy Production to GitHub Pages

on:
  workflow_run:
    workflows: ["Check & Test"]
    branches: [main]
    types: [completed]

# Keep in sync with the other workflows and with the dioxus version in
# Cargo.toml. DX_SHA256 is the sha256 of the linux-gnu release tarball.
env:
  DX_VERSION: v0.7.10
  DX_SHA256: 4363e4ed2a3f1eb7f4d38d2d59aed59ce43271c44c16b425e92c89a64761fbe7

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Dioxus CLI
        run: |
          wget -q "https://github.com/DioxusLabs/dioxus/releases/download/${DX_VERSION}/dx-x86_64-unknown-linux-gnu.tar.gz"
          echo "${DX_SHA256}  dx-x86_64-unknown-linux-gnu.tar.gz" | sha256sum -c
          tar -xzf dx-x86_64-unknown-linux-gnu.tar.gz
          chmod +x dx
          sudo mv dx /usr/local/bin/

      - name: Install npm dependencies
        run: npm install

      - name: Tailwind CSS Generation
        run: npx @tailwindcss/cli -i input.css -o assets/tailwind.css

      - name: Update base path for production deployment
        run: |
          sed -i 's/base_path = "open-farming-hackdays-label-creator"/base_path = ""/' Dioxus.toml
          echo "Updated Dioxus.toml base_path for production deployment"

      # The cargo cache restores target/, and dx appends every build's
      # content-hashed wasm/js into web/public/assets without pruning. Stale
      # artifacts otherwise pile up and get published (seen locally: 290 MB
      # of public/ for a 4.4 MB site).
      - name: Clear stale build output
        run: rm -rf ./target/dx/open-farming-hackdays-label-creator/release/web/public

      - name: Build with Dioxus (Production - hidebio feature)
        run: dx build --release --features hidebio

      - name: Configure SPA routing for production
        run: |
          PUBLIC_DIR="./target/dx/open-farming-hackdays-label-creator/release/web/public"
          cp "$PUBLIC_DIR/index.html" "$PUBLIC_DIR/404.html"
          cp "./public/CNAME" "$PUBLIC_DIR/CNAME"
          rm -f "$PUBLIC_DIR/robots.txt"

      # declarino.ch wird von Vercel aus bar9/declarino bedient, und der Deploy
      # unten ersetzt dort den gesamten Inhalt (keep_files ist standardmässig
      # false). Der Kurz-Link-Endpunkt muss deshalb bei jedem Deploy
      # mitgeliefert werden — läge er nur im Zielrepo, würde er beim nächsten
      # Lauf gelöscht.
      - name: Add URL shortener functions
        run: |
          PUBLIC_DIR="./target/dx/open-farming-hackdays-label-creator/release/web/public"
          cp -r ./api "$PUBLIC_DIR/api"
          # Selbsttest und Doku gehören nicht ins Deployment: der Test braucht
          # eine Redis-Instanz, die Doku wäre sonst unter /api/README.md
          # öffentlich abrufbar. (_lib.mjs bleibt: Vercel behandelt Dateien mit
          # Unterstrich als Hilfsmodul, nicht als eigene Funktion.)
          # Nur die beiden Endpunkte und ihre Hilfsmodule gehören ins
          # Deployment. Test-, Sicherungs- und Doku-Dateien wären sonst
          # öffentlich abrufbar.
          rm -f "$PUBLIC_DIR/api/selftest.mjs" "$PUBLIC_DIR/api/README.md" \
                "$PUBLIC_DIR/api/backup.mjs" "$PUBLIC_DIR/api/routecheck.cjs" \
                "$PUBLIC_DIR/api/routecases.json" \
                "$PUBLIC_DIR/api/uitest_share_modal.mjs"
          cp ./vercel.json "$PUBLIC_DIR/vercel.json"

      - name: Deploy to Production GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          deploy_key: ${{ secrets.PRODUCTION_DEPLOY_KEY }}
          external_repository: bar9/declarino
          publish_branch: gh-pages
          publish_dir: ./target/dx/open-farming-hackdays-label-creator/release/web/public
          # Kein `clean: true`: die Option kennt diese Action nicht, sie wurde
          # nur mit einer Warnung ignoriert. Der Zielinhalt wird ohnehin
          # vollständig ersetzt, weil `keep_files` standardmässig false ist.

name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["Check & Test"]
    branches: [main]
    types: [completed]

# Keep in sync with the other workflows and with the dioxus version in
# Cargo.toml. DX_SHA256 is the sha256 of the linux-gnu release tarball.
env:
  DX_VERSION: v0.7.10
  DX_SHA256: 4363e4ed2a3f1eb7f4d38d2d59aed59ce43271c44c16b425e92c89a64761fbe7

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Dioxus CLI
        run: |
          wget -q "https://github.com/DioxusLabs/dioxus/releases/download/${DX_VERSION}/dx-x86_64-unknown-linux-gnu.tar.gz"
          echo "${DX_SHA256}  dx-x86_64-unknown-linux-gnu.tar.gz" | sha256sum -c
          tar -xzf dx-x86_64-unknown-linux-gnu.tar.gz
          chmod +x dx
          sudo mv dx /usr/local/bin/

      - name: Install npm dependencies
        run: npm install

      - name: Tailwind CSS Generation
        run: npx @tailwindcss/cli -i input.css -o assets/tailwind.css

      # The cargo cache restores target/, and dx appends every build's
      # content-hashed wasm/js into web/public/assets without pruning. Stale
      # artifacts otherwise pile up and get published (seen locally: 290 MB
      # of public/ for a 4.4 MB site).
      - name: Clear stale build output
        run: rm -rf ./target/dx/open-farming-hackdays-label-creator/release/web/public

      - name: Build with Dioxus
        run: dx build --release

      - name: Configure SPA routing for GitHub Pages
        run: |
          PUBLIC_DIR="./target/dx/open-farming-hackdays-label-creator/release/web/public"
          cp "$PUBLIC_DIR/index.html" "$PUBLIC_DIR/404.html"
          cp "./public/robots.txt" "$PUBLIC_DIR/robots.txt"

      # January comparison instance (Testing 25.06.2026, hand note 6): the last
      # January state (f1a2bb9, "Version vom Januar") published under /v0.8.0/
      # so Mirjam can compare the old Herkunft behavior. Same dx pipeline.
      - name: Checkout January comparison version
        uses: actions/checkout@v4
        with:
          ref: f1a2bb94514b30c888bc5a6cad7c0ca6f31e6225
          path: v080-src

      - name: Build January version under /v0.8.0/
        run: |
          cd v080-src
          sed -i 's|^base_path = .*|base_path = "open-farming-hackdays-label-creator/v0.8.0"|' Dioxus.toml
          npm install
          npx @tailwindcss/cli -i input.css -o assets/tailwind.css
          dx build --release
          OLD_PUBLIC="./target/dx/open-farming-hackdays-label-creator/release/web/public"
          cp "$OLD_PUBLIC/index.html" "$OLD_PUBLIC/404.html"
          DEST="../target/dx/open-farming-hackdays-label-creator/release/web/public/v0.8.0"
          mkdir -p "$DEST"
          cp -r "$OLD_PUBLIC"/. "$DEST/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          publish_dir: ./target/dx/open-farming-hackdays-label-creator/release/web/public
          # Kein `clean: true`: die Option kennt diese Action nicht und wurde
          # nur mit einer Warnung ignoriert. Ersetzt wird ohnehin vollständig,
          # weil `keep_files` standardmässig false ist.

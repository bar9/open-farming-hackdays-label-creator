name: Check & Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Keep in sync with the other workflows and with the dioxus version in
# Cargo.toml. DX_SHA256 is the sha256 of the linux-gnu release tarball.
env:
  DX_VERSION: v0.7.10
  DX_SHA256: 4363e4ed2a3f1eb7f4d38d2d59aed59ce43271c44c16b425e92c89a64761fbe7

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Dioxus CLI
        run: |
          wget -q "https://github.com/DioxusLabs/dioxus/releases/download/${DX_VERSION}/dx-x86_64-unknown-linux-gnu.tar.gz"
          echo "${DX_SHA256}  dx-x86_64-unknown-linux-gnu.tar.gz" | sha256sum -c
          tar -xzf dx-x86_64-unknown-linux-gnu.tar.gz
          chmod +x dx
          sudo mv dx /usr/local/bin/

      - name: Install npm dependencies
        run: npm install

      - name: Tailwind CSS Generation
        run: npx @tailwindcss/cli -i input.css -o assets/tailwind.css

      - name: Cargo check
        run: cargo check

      # --all-targets to match `make lint`: without it, warnings in tests are
      # invisible to CI and accumulate.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Matches `make test`. locale_parity guards the three locale files
      # against drift and is the only non-e2e integration test.
      - name: Cargo test
        run: cargo test --bins --test locale_parity

      # Die Shortener-Funktionen laufen auf Vercel, nicht im WASM-Build, und
      # würden von cargo also nie angefasst. Ein Syntaxfehler fiele sonst erst
      # in der Produktion auf. Der volle Selbsttest braucht eine Datenbank und
      # läuft deshalb nicht in CI (siehe api/README.md).
      - name: Check shortener functions
        run: |
          for f in api/*.mjs; do node --check "$f"; done
          node -e "import('./api/_lib.mjs').then(m => {
            if (!m.codeForUrl || !m.isAllowedTarget) throw new Error('api/_lib.mjs exports missing');
            if (m.codeForUrl('https://a') === m.codeForUrl('https://b')) throw new Error('codeForUrl collides');
            if (!m.isAllowedTarget('https://www.declarino.ch/x')) throw new Error('declarino.ch must be allowed');
            if (m.isAllowedTarget('https://example.com/x')) throw new Error('foreign hosts must be rejected');
            console.log('shortener functions ok');
          })"
          node -e "import('./api/_storage.mjs').then(m => {
            // Ohne Konfiguration darf nichts stillschweigend passieren:
            // ein falsch gesetztes Projekt soll einen klaren Fehler geben.
            if (m.storageBackend() !== null) throw new Error('backend detected without env vars');
            return m.lookup('x').then(
              () => { throw new Error('lookup must fail without storage config'); },
              (e) => {
                if (!/Kein Speicher konfiguriert/.test(e.message)) throw e;
                console.log('storage backend selection ok');
              }
            );
          })"

      # Die Rewrites in vercel.json entscheiden, ob Kurz-Links funktionieren.
      # Ein Catch-all ohne die Ausnahme für /s/ würde jeden Kurz-Link stumm
      # auf die App umleiten (HTTP 200 statt 301) -- gedruckte Etiketten wären
      # tot. Geprüft wird mit derselben Bibliothek, die Vercel benutzt.
      - name: Check vercel.json routing
        run: npm run check:routes

      - name: Dioxus build
        run: dx build --release

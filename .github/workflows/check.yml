name: Check & Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Keep in sync with the other workflows and with the dioxus version in
# Cargo.toml. DX_SHA256 is the sha256 of the linux-gnu release tarball.
env:
  DX_VERSION: v0.7.10
  DX_SHA256: 4363e4ed2a3f1eb7f4d38d2d59aed59ce43271c44c16b425e92c89a64761fbe7

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            api/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Dioxus CLI
        run: |
          wget -q "https://github.com/DioxusLabs/dioxus/releases/download/${DX_VERSION}/dx-x86_64-unknown-linux-gnu.tar.gz"
          echo "${DX_SHA256}  dx-x86_64-unknown-linux-gnu.tar.gz" | sha256sum -c
          tar -xzf dx-x86_64-unknown-linux-gnu.tar.gz
          chmod +x dx
          sudo mv dx /usr/local/bin/

      - name: Install npm dependencies
        run: npm install

      - name: Tailwind CSS Generation
        run: npx @tailwindcss/cli -i input.css -o assets/tailwind.css

      - name: Cargo check
        run: cargo check

      # --all-targets to match `make lint`: without it, warnings in tests are
      # invisible to CI and accumulate.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Matches `make test`. locale_parity guards the three locale files
      # against drift and is the only non-e2e integration test.
      - name: Cargo test
        run: cargo test --bins --test locale_parity

      # Der Kurz-Link-Dienst (api/, eigenes Rust-Paket) läuft auf dem Server,
      # nicht im WASM-Build. Ohne diesen Schritt fiele ein Fehler erst in der
      # Produktion auf. Die Tests laufen gegen eine flüchtige Datenbank.
      - name: Shortener (fmt, clippy, test)
        working-directory: api
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

      # Der Teilen-Link traegt die ganze Rezeptur im Query-String, inklusive
      # producer_name, -address, -phone und -email. Faellt data-exclude-search
      # weg, sendet der Tracker diese Personendaten bei jedem Aufruf eines
      # geteilten oder gedruckten Kurz-Links an Umami. Das waere von aussen
      # unsichtbar, deshalb hier als harte Bedingung.
      #
      # Der Schritt schuetzt wirklich: Beide Deploy-Workflows haengen per
      # workflow_run an diesem hier und laufen nur bei conclusion == 'success'.
      # Der manuelle Produktions-Deploy (workflow_dispatch) baut denselben
      # Stand und prueft die Flags dort noch einmal selbst.
      - name: Check analytics privacy flags
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('index.html', 'utf8');
            if (!html.includes('cloud.umami.is')) {
              console.log('kein Umami-Snippet vorhanden, nichts zu pruefen');
              process.exit(0);
            }
            const required = {
              'data-exclude-search=\"true\"': 'Rezeptur/Personendaten im Query-String',
              'data-do-not-track=\"true\"': 'Do-Not-Track des Browsers',
              'data-domains=': 'Begrenzung auf die Produktionsdomaene',
            };
            const missing = Object.entries(required).filter(([a]) => !html.includes(a));
            if (missing.length) {
              for (const [a, why] of missing) console.error('FEHLT: ' + a + '  (' + why + ')');
              process.exit(1);
            }
            // Das Snippet muss im head stehen, sonst greift es nicht.
            const head = html.slice(html.indexOf('<head'), html.indexOf('</head>'));
            if (!head.includes('cloud.umami.is')) {
              console.error('Umami-Snippet steht nicht im <head>');
              process.exit(1);
            }
            console.log('analytics privacy flags ok');
          "

      # Die Caddy-Konfiguration entscheidet, ob Kurz-Links funktionieren. Ein
      # SPA-Fallback vor der /s/-Weiterleitung lieferte bei jedem Kurz-Link
      # die App (HTTP 200 statt 301): gedruckte Etiketten wären still tot.
      # Geprüft wird die echte ops/caddy/Caddyfile mit dem echten Dienst.
      - name: Check Caddy routing
        run: |
          # Caddy aus Ubuntu (gleiches Paket wie auf dem Debian-Server).
          sudo apt-get install -y --no-install-recommends caddy >/dev/null
          sudo systemctl stop caddy || true
          caddy version
          (cd api && cargo build --release --locked)
          bash ops/caddy/test-routing.sh api/target/release/shortener

      - name: Dioxus build
        run: dx build --release
